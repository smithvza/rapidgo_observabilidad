name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Airflow for DAG validation
        run: >-
          python -m pip install
          "apache-airflow==3.1.3"
          "apache-airflow-providers-standard"
          --constraint
          "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.13.txt"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall producer spark tests
      - name: Run rules and DAG tests
        run: pytest -v
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
  dag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Airflow test dependencies
        run: |
          python -m pip install "apache-airflow==2.10.5" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
      - name: Validate Airflow DAG
        run: python -m pytest -v tests/test_dag_integrity.py
